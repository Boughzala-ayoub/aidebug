name: Python debugger checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the CLI and test runner
        run: python -m pip install . pytest
      - name: Check DAP transport and recording
        run: |
          python -I checks/transport.py
          python -I checks/recording.py
          python checks/test_buggy.py
          python checks/reports.py
      - name: Check installed CLI and process cleanup
        run: python checks/integration.py --cli "$(command -v aidebug)"
      - name: Debug multi-file unittest and pytest failures
        run: python checks/project.py --cli "$(command -v aidebug)" --pytest-python "$(command -v python)"
